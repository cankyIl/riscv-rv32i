name: test

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install simulators
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: Lint
        run: make lint
      - name: Test (Icarus)
        run: make test SIM=icarus
      - name: Test (Verilator)
        run: make test SIM=verilator
